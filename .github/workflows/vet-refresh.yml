# Refresh stale vet exemptions on dependency-bump PRs.
#
# Renovate bumps a dependency, the resolved version changes, and every
# version-pinned exemption naming the old version stops matching. `cargo vet`
# goes red and blocks the automerge Renovate was configured to perform. With
# 7,059 version-pinned exemptions across this fleet and a bot bumping
# continuously, the two tools fight by construction.
#
# This refreshes those pins so the bump PR arrives vet-green. It deliberately
# does NOT accept a crate that was not in the graph before -- see the script.
name: Vet Refresh

on:
  workflow_call:
    inputs:
      system-packages:
        description: Space-separated apt packages needed before cargo can resolve.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh vet exemptions
    # Only for bot-authored dependency PRs. A human editing dependencies should
    # see the red and decide for themselves; this exists to remove bookkeeping,
    # not review.
    if: >
      github.event_name == 'pull_request' &&
      (github.actor == 'renovate[bot]' || startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install system packages
        if: inputs.system-packages != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-vet

      - name: Fetch the refresh script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SecurityRonin/fleet-ci
          ref: ${{ github.job_workflow_sha }}
          path: .fleet-ci
          persist-credentials: false

      - name: Refresh exemptions for version churn
        id: refresh
        shell: bash
        run: python3 .fleet-ci/scripts/refresh_vet_exemptions.py

      - name: Commit the refreshed pins
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fleet-ci
          if git diff --quiet -- supply-chain/; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supply-chain/
          # -F, never -m: a bumped crate name could contain shell metacharacters,
          # and a message body is not a place to invite command substitution.
          cat > /tmp/vetmsg <<'MSG'
          chore(supply-chain): refresh vet exemption version pins

          A dependency bump moved resolved versions, so the version-pinned
          exemptions naming the old ones stopped matching and cargo vet went red.

          This refreshes those pins ONLY. No crate entered the dependency graph
          that was not exempted before -- the refresh job refuses that case and
          leaves the PR red, because accepting a new dependency is a
          supply-chain decision and not bookkeeping.

          An exemption asserts that nobody audited the crate. That statement is
          equally true before and after a version bump, so nothing is claimed
          here that was not already true.
          MSG
          git commit -q -F /tmp/vetmsg
          git push
