      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      # `--no-deps` keeps the gate on this workspace's own docs: a broken link in
      # a dependency is not this repo's to fix and would make the gate red for
