# SecurityRonin fleet — reusable Rust CI.
#
# One workflow, called by every fleet repo. Replaces 89 hand-maintained
# variants. See README.md for the caller stub and the input reference.
#
# Every third-party action is pinned to a full commit SHA whose tag was
# verified against the GitHub API (`gh api repos/<o>/<r>/commits/<tag>`),
# not copied from another workflow. Bump them here, once, fleet-wide.

name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      msrv:
        description: >
          MSRV to verify. Leave empty (the default) to derive it from the
          workspace's own `rust-version` — the declared promise is then
          structurally incapable of disagreeing with the job that verifies it.
          Set explicitly only to test a floor *below* what Cargo.toml declares.
        type: string
        default: ""
      msrv-check:
        description: >
          What the MSRV job runs: `build` (compiles on the floor) or `test`
          (also runs the suite there). `test` is stricter; `build` is right
          when dev-dependencies outrun the library's own floor.
        type: string
        default: build
      os-matrix:
        description: Run the test job on ubuntu + macos + windows.
        type: boolean
        default: true
      test-os:
        description: >
          Explicit runner list for the test job, as a JSON array — e.g.
          '["ubuntu-latest","macos-latest"]'. Overrides `os-matrix` when set.

          `os-matrix` is a boolean, so it can only say "all three" or
          "ubuntu only". A repo that legitimately tests on ubuntu AND macos but
          not windows had no way to say so: true added an unsupported platform,
          false silently dropped a supported one. Neither preserves the
          decision, and an adoption PR that narrows a repo's tested platforms is
          a behaviour change wearing a config change's clothes.

          Empty (the default) leaves `os-matrix` in charge, so repos already
          adopted are unaffected.
        type: string
        default: ""
      system-packages:
        description: >
          Space-separated apt packages to install before any job that links
          native code. Empty (the default) installs nothing and adds no step.

          A crate with a C dependency fails in the LINKER rather than in cargo,
          so the failure looks nothing like a missing input — fuser without
          libfuse3-dev reports "failed to run custom build command". Repos
          carried this as a hand-written apt step per job; adopting this
          workflow would otherwise drop it silently.

          LINUX ONLY by design: gated on `runner.os == 'Linux'`, so the macOS
          and Windows legs of the test matrix skip it. A crate whose native
          dependency is unavailable there should set `os-matrix: false` rather
          than expect this input to paper over it.
        type: string
        default: ""
      all-features:
        description: >
          Append `--all-features` to clippy/test/coverage. Default true per
          the batteries-included policy. Turn off only for a crate with
          genuinely mutually-exclusive features.
        type: boolean
        default: true
      coverage-gate:
        description: >
          `strict`  — every executable line covered, except lines annotated
                      `// cov:unreachable: <invariant>`. This is the fleet
                      standard.
          `floor`   — aggregate line percentage >= `coverage-floor`. MIGRATION
                      STATE ONLY: an aggregate cannot honour a per-line
                      exemption, so a repo on `floor` is not meeting the
                      standard. The job name says so in the checks UI.
          `off`     — no coverage job.
        type: string
        default: strict
      coverage-floor:
        description: "Percentage floor for `coverage-gate: floor`. Ignored otherwise."
        type: number
        default: 100
      coverage-scope:
        description: >
          What gets MEASURED.
          `workspace`      — all members, all test targets (unit + integration).
          `lib`            — `--workspace --lib`, unit tests only. Under-counts any
                             repo whose oracle/differential suites live in tests/.
          `package:<name>` — one member (`-p <name>`), for an umbrella workspace
                             where only one crate carries the gated surface.
        type: string
        default: workspace
      coverage-metric:
        description: >
          What must be COVERED. `lines` (default, the historical behaviour),
          `functions`, or `both`.

          Lines alone are blind to a function that is never entered while its
          lines are covered by another monomorphized instance of the same
          generic: llvm-cov emits one FN record per instantiation but one DA
          record per source line, so a reader-generic crate can sit at 100%
          lines with instantiations nobody ever called. Repos whose invariant
          is "every instantiation is exercised" want `functions` or `both`.
        type: string
        default: lines
      coverage-ignore-regex:
        description: Passed to `--ignore-filename-regex` when non-empty. Excludes from MEASUREMENT.
        type: string
        default: ""
      coverage-include-regex:
        description: >
          Restricts WHERE the strict gate applies, to files whose path matches.
          Empty (the default) gates everything measured.

          This is the positive complement of `coverage-ignore-regex`, and it
          exists because that input cannot express it: `--ignore-filename-regex`
          is evaluated by the Rust regex crate, which has no lookahead, so
          "gate only this path" is not writable as an exclusion. Files outside
          the pattern are still measured — the reported numbers stay honest —
          they are simply not gated, which is how a repo holds one published
          surface at 100% while the rest carries tracked debt.

          A pattern matching NO file in the report is an error, not a pass: a
          gate running over zero files reports green having verified nothing.
        type: string
        default: ""
      require-exemption-reason:
        description: >
          Reject a bare `// cov:unreachable` with no `: <invariant>` after it.
          The marker asserts a guard is provably dead; an assertion with no
          stated invariant cannot be reviewed. Default true.
        type: boolean
        default: true
      deny-config-repo:
        description: >
          Repo holding a SHARED deny.toml, e.g. "SecurityRonin/fleet-config".
          Empty (the DEFAULT) uses the repository's own deny.toml.

          The default is empty deliberately. It used to point at fleet-config,
          which meant adopting this workflow silently swapped every repo's
          supply-chain policy for the shared one. Measured when that was caught:
          61 of 65 adopted repos had `ignore = []` locally and inherited 21
          advisory ignores — among them RUSTSEC-2023-0071 (rsa Marvin timing
          attack) — none carrying a reason or a removal condition. Several also
          went from `multiple-versions = "deny"` to `"warn"` and gained 9 allowed
          licences.

          A repo's own deny.toml is its deliberate policy. Replacing it is a
          supply-chain decision that deserves its own PR and its own argument,
          not a side effect of moving onto shared CI. Set this input explicitly
          to opt in.
        type: string
        default: ""
      deny-config-ref:
        description: Ref of `deny-config-repo` to check out. Pin to a SHA in production.
        type: string
        default: main
      deny-config-path:
        description: Path to deny.toml within `deny-config-repo`.
        type: string
        default: deny.toml
      deny-args:
        description: >
          Extra cargo-deny GLOBAL arguments, inserted before the `check`
          subcommand. This is how a repo carries a setting the shared config
          cannot: `--all-features` (do NOT put this in the shared file — at
          fleet scope it pulls optional GPL-2.0/GPL-3.0 crates such as lzo1x
          and noalloc into the graph that are correctly out of scope under
          default features), `--exclude <crate>` for fuzz members, and
          `--target <triple>`, which overrides the config's top-level
          `targets = []`. Keep it empty unless the repo genuinely needs one.
        type: string
        default: ""
      job-timeout-minutes:
        description: >
          Ceiling for the compiling jobs (clippy, test, msrv, fuzz-build,
          coverage). Metadata and scan jobs are capped at 20 regardless.

          A job with no ceiling inherits GitHub's six-hour default, which is not
          a timeout so much as a way to lose a runner: a hung `apt-get update`
          burned six hours across six repos before being cancelled. Raise this
          for a repo that bundles heavy C/C++ rather than removing it.
        type: number
        default: 45
      free-disk-space:
        description: >
          Reclaim ~30 GB on Linux runners before compiling. Default false.

          For a workspace that bundles heavy C/C++ (DuckDB, RocksDB, wasmtime)
          the runner's 14 GB is not enough and the build dies on "No space left
          on device" -- which reads as a build failure and is a disk failure.
          Costs ~2 minutes, so it is opt-in rather than always on.
        type: boolean
        default: false
      system-packages-macos:
        description: >
          Packages to `brew install` on macOS runners. The `system-packages`
          input is apt, so it is Linux-only; a repo whose macOS leg needs a
          native tool had no way to say so and failed only on that leg.
        type: string
        default: ""
      cargo-config:
        description: >
          Appended to `$CARGO_HOME/config.toml` before any compiling job.

          The case this exists for: linking ~100 test binaries against ~800
          crates plus bundled C++ exhausts the runner under the default linker
          -- GNU ld SIGBUSes and mold deadlocks for six hours. Selecting lld is
          a cargo-config concern, and there was no way to express it.
        type: string
        default: ""
      build-env:
        description: >
          Newline-separated `KEY=VALUE` pairs exported to every compiling job.

          Its companion case is `CARGO_PROFILE_TEST_DEBUG=0`: full debuginfo on
          a large bundled-C++ workspace is what drives the linker out of memory,
          so dropping it is the root-cause fix rather than a workaround.
        type: string
        default: ""
      msrv-args:
        description: >
          Extra arguments for the MSRV job only, e.g. `--no-default-features`.

          A lib+CLI hybrid commonly declares a low floor for the library while an
          optional default feature pulls a dependency that needs more. Verifying
          the promise means building WITHOUT that feature; with no way to say so
          the MSRV job fails on a correct repo, and the only escape was raising
          the published floor -- weakening a real promise to satisfy CI.
        type: string
        default: ""
      package-check:
        description: >
          Assert every publishable crate packages README.md and a LICENSE file.
          Default true; harmless for a repo that publishes nothing, since it
          then has no crate to check.

          `cargo package --list` is the only thing that shows what a consumer
          actually receives. A README that exists in the repo but is excluded by
          an `include` key reaches crates.io as a blank page, and nothing else in
          CI looks. Five fleet repos hand-rolled this same job beside the shared
          workflow, where the aggregate gate could not reach it.
        type: boolean
        default: true
      vet:
        description: Run `cargo vet` (supply-chain, unreviewed-code gate).
        type: boolean
        default: true
      secret-scan:
        description: Run the gitleaks secret scan. Should never be false.
        type: boolean
        default: true
      gitleaks-version:
        description: Pinned gitleaks release.
        type: string
        # renovate: datasource=github-releases depName=gitleaks/gitleaks
        default: "8.30.1"
      unsafe-audit:
        description: >
          Assert every workspace member EFFECTIVELY forbids or denies
          `unsafe_code`. Default true.

          This is not a re-check of what the compiler already guarantees. Where
          the lint is in force, `unsafe` is a compile error and asserting its
          absence would be a check that cannot fail. What nothing else verifies
          is that the lint is in force AT ALL for each member: a `[lints]` table
          in a member REPLACES workspace inheritance rather than extending it,
          and a member with no `[lints]` table does not inherit at all, because
          inheritance is opt-in via `[lints] workspace = true`. Either way the
          member compiles with `unsafe` permitted while the workspace root still
          reads compliant.
        type: boolean
        default: true
      unsafe-audit-exempt:
        description: >
          Comma- or newline-separated member names exempt from `unsafe-audit`,
          for crates where the lint is genuinely impossible — a PyO3
          `extension-module` or a wasm-bindgen shim generates `unsafe` it does
          not own. Naming them here keeps the exemption visible and reviewable
          instead of turning the whole gate off.
        type: string
        default: ""
      fuzz-build-check:
        description: >
          Build the fuzz targets when a `fuzz/` directory exists (a compile
          check, not a campaign — the long run belongs in fuzz.yml). Auto-skips
          when there is no fuzz/ directory, so this needs no per-repo wiring.
        type: boolean
        default: true
      rustdoc-check:
        description: >
          Build rustdoc with warnings denied. Catches broken intra-doc links and
          malformed doc attributes, which no other job here sees — clippy does
          not read doc comments and the test job does not build docs. 37 of the
          fleet's 92 repos already run this in their own ci.yml, so a repo
          adopting this workflow would otherwise lose a gate it had.
        type: boolean
        default: true

# The GITHUB_TOKEN gets read-only repository access and nothing else. A called
# workflow can never hold more than its caller grants, so the caller declares
# the same block; this one is the floor, not a request.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings
  # Caller-level `env:` is NOT inherited by a called workflow, so everything
  # the jobs below rely on has to be declared right here.

jobs:
  # Runs first and cheapest, because when it fails every other job below fails
  # too -- with an error that names a workspace member rather than the
  # dependency that escaped. This job supplies the diagnosis those six or ten
  # simultaneous failures do not.
  path-deps:
    timeout-minutes: 20
    name: Single-checkout buildability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # `job_workflow_sha` is the commit of THIS reusable workflow, so the
      # script is fetched at exactly the revision the caller pinned -- not from
      # a floating branch, and not at `deny-config-ref`, which belongs to a
      # different repository.
      - name: Fetch the check
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SecurityRonin/fleet-ci
          ref: ${{ github.job_workflow_sha }}
          path: .fleet-ci
      - name: No path dependency may escape the repository
        run: python3 .fleet-ci/scripts/check_path_deps.py "$GITHUB_WORKSPACE"

  fmt:
    timeout-minutes: 20
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        if: inputs.free-disk-space && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Install system packages (macOS)
        if: inputs.system-packages-macos != '' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `brew install` is already retried internally and bounded by the job
          # ceiling; `--quiet` keeps the log readable.
          brew install --quiet ${{ inputs.system-packages-macos }}
      - name: Install system packages
        if: inputs.system-packages != '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Bounded and retried, deliberately. `apt-get update` with no timeout
          # hung on an unreachable Azure mirror and sat there until GitHub killed
          # the job on its SIX HOUR limit -- six repos, one wasted runner each,
          # and a red `ci / All checks` that looked like a code failure. A mirror
          # being unreachable is infrastructure; it should fail in minutes and
          # say so, not consume the job's entire budget.
          attempt=1
          until sudo timeout 300 apt-get update; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::apt-get update failed or timed out on all 3 attempts. The runner's package mirror is unreachable; this is infrastructure, not a code failure."
              exit 1
            fi
            echo "::warning::apt-get update failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          sudo timeout 600 apt-get install -y ${{ inputs.system-packages }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - name: Apply cargo config and build env
        if: inputs.cargo-config != '' || inputs.build-env != ''
        shell: bash
        env:
          CARGO_CONFIG: ${{ inputs.cargo-config }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          # Through env, never inlined: both values are free-form text and GitHub
          # substitutes expressions into the SCRIPT TEXT, where a quote or a
          # bracket would reach bash as syntax.
          if [ -n "${CARGO_CONFIG:-}" ]; then
            mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
            printf '%s\n' "$CARGO_CONFIG" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
            echo "appended to ${CARGO_HOME:-$HOME/.cargo}/config.toml:"
            printf '%s\n' "$CARGO_CONFIG"
          fi
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) printf '%s\n' "$line" >> "$GITHUB_ENV"; echo "exported: $line" ;;
                *)   echo "::error::build-env line is not KEY=VALUE: $line"; exit 1 ;;
              esac
            done <<< "$BUILD_ENV"
          fi
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --workspace --all-targets ${{ inputs.all-features && '--all-features' || '' }} -- -D warnings

  test:
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # test-os wins when set; otherwise the os-matrix boolean, unchanged.
        os: ${{ inputs.test-os != '' && fromJSON(inputs.test-os) || (inputs.os-matrix && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]')) }}
    steps:
      - name: Free disk space
        if: inputs.free-disk-space && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Install system packages (macOS)
        if: inputs.system-packages-macos != '' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `brew install` is already retried internally and bounded by the job
          # ceiling; `--quiet` keeps the log readable.
          brew install --quiet ${{ inputs.system-packages-macos }}
      - name: Install system packages
        if: inputs.system-packages != '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Bounded and retried, deliberately. `apt-get update` with no timeout
          # hung on an unreachable Azure mirror and sat there until GitHub killed
          # the job on its SIX HOUR limit -- six repos, one wasted runner each,
          # and a red `ci / All checks` that looked like a code failure. A mirror
          # being unreachable is infrastructure; it should fail in minutes and
          # say so, not consume the job's entire budget.
          attempt=1
          until sudo timeout 300 apt-get update; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::apt-get update failed or timed out on all 3 attempts. The runner's package mirror is unreachable; this is infrastructure, not a code failure."
              exit 1
            fi
            echo "::warning::apt-get update failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          sudo timeout 600 apt-get install -y ${{ inputs.system-packages }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Apply cargo config and build env
        if: inputs.cargo-config != '' || inputs.build-env != ''
        shell: bash
        env:
          CARGO_CONFIG: ${{ inputs.cargo-config }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          # Through env, never inlined: both values are free-form text and GitHub
          # substitutes expressions into the SCRIPT TEXT, where a quote or a
          # bracket would reach bash as syntax.
          if [ -n "${CARGO_CONFIG:-}" ]; then
            mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
            printf '%s\n' "$CARGO_CONFIG" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
            echo "appended to ${CARGO_HOME:-$HOME/.cargo}/config.toml:"
            printf '%s\n' "$CARGO_CONFIG"
          fi
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) printf '%s\n' "$line" >> "$GITHUB_ENV"; echo "exported: $line" ;;
                *)   echo "::error::build-env line is not KEY=VALUE: $line"; exit 1 ;;
              esac
            done <<< "$BUILD_ENV"
          fi
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test --workspace ${{ inputs.all-features && '--all-features' || '' }}

  # One job PER MEMBER, each built at the floor that member declares.
  #
  # This previously took min(member rust-version) and built --workspace at it.
  # That is correct only when every member shares one floor. Where members
  # legitimately differ -- one pulls a heavier dependency tree than another -- it
  # demanded the HIGH-floor member compile at the LOW-floor member's version,
  # which nothing promised and nothing can deliver. Observed live in
  # chromium-storage-forensic: members declaring 1.80 / 1.87 / 1.88, all three
  # truthful, all three red, because the job tried the whole workspace at 1.80
  # and cargo died parsing a dependency's manifest on edition 2024.
  #
  # A declared rust-version is a promise made by THAT crate to ITS consumers.
  # Verifying it means building THAT crate at THAT version. A single-floor
  # workspace yields one matrix entry and behaves exactly as before; a
  # heterogeneous one now verifies every promise instead of failing on a floor
  # nobody ever made.
  msrv-matrix:
    timeout-minutes: 20
    name: MSRV (resolve)
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.resolve.outputs.members }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Resolve per-member MSRV
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          override='${{ inputs.msrv }}'
          if [ -n "$override" ]; then
            members="$(jq -nc --arg v "$override" '[{name:"",msrv:$v}]')"
            echo "MSRV (caller override, whole workspace): $override"
          else
            members="$(cargo metadata --no-deps --format-version 1 | jq -c '
              [ .packages[] | select(.rust_version != null)
                | {name: .name, msrv: .rust_version} ] | unique_by(.name)')"
            if [ "$members" = "[]" ]; then
              echo "::error::no workspace member declares rust-version. Add one to Cargo.toml, or set this workflow's msrv input explicitly - this job refuses to guess a floor it would then claim to have verified."
              exit 1
            fi
            echo "MSRV per member:"
            echo "$members" | jq -r '.[] | "  " + .name + ": " + .msrv'
          fi
          echo "members=$members" >> "$GITHUB_OUTPUT"

  msrv:
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    name: MSRV
    needs: msrv-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.msrv-matrix.outputs.members) }}
    steps:
      - name: Free disk space
        if: inputs.free-disk-space && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Install system packages (macOS)
        if: inputs.system-packages-macos != '' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `brew install` is already retried internally and bounded by the job
          # ceiling; `--quiet` keeps the log readable.
          brew install --quiet ${{ inputs.system-packages-macos }}
      - name: Install system packages
        if: inputs.system-packages != '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Bounded and retried, deliberately. `apt-get update` with no timeout
          # hung on an unreachable Azure mirror and sat there until GitHub killed
          # the job on its SIX HOUR limit -- six repos, one wasted runner each,
          # and a red `ci / All checks` that looked like a code failure. A mirror
          # being unreachable is infrastructure; it should fail in minutes and
          # say so, not consume the job's entire budget.
          attempt=1
          until sudo timeout 300 apt-get update; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::apt-get update failed or timed out on all 3 attempts. The runner's package mirror is unreachable; this is infrastructure, not a code failure."
              exit 1
            fi
            echo "::warning::apt-get update failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          sudo timeout 600 apt-get install -y ${{ inputs.system-packages }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.member.msrv }}
      - name: Apply cargo config and build env
        if: inputs.cargo-config != '' || inputs.build-env != ''
        shell: bash
        env:
          CARGO_CONFIG: ${{ inputs.cargo-config }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          # Through env, never inlined: both values are free-form text and GitHub
          # substitutes expressions into the SCRIPT TEXT, where a quote or a
          # bracket would reach bash as syntax.
          if [ -n "${CARGO_CONFIG:-}" ]; then
            mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
            printf '%s\n' "$CARGO_CONFIG" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
            echo "appended to ${CARGO_HOME:-$HOME/.cargo}/config.toml:"
            printf '%s\n' "$CARGO_CONFIG"
          fi
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) printf '%s\n' "$line" >> "$GITHUB_ENV"; echo "exported: $line" ;;
                *)   echo "::error::build-env line is not KEY=VALUE: $line"; exit 1 ;;
              esac
            done <<< "$BUILD_ENV"
          fi
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The explicit `+<version>` beats rust-toolchain.toml's pin, which is the
      # DEV toolchain rather than the floor. Without it this job silently
      # verifies the wrong thing. An empty member name means a caller override,
      # so the scope is the whole workspace.
      - name: Build at the declared floor
        shell: bash
        env:
          MEMBER: ${{ matrix.member.name }}
          MSRV: ${{ matrix.member.msrv }}
          CHECK: ${{ inputs.msrv-check }}
          ALLF: ${{ inputs.all-features }}
          MSRV_ARGS: ${{ inputs.msrv-args }}
        run: |
          set -euo pipefail
          scope=(--workspace)
          if [ -n "${MEMBER:-}" ]; then scope=(-p "$MEMBER"); fi
          # msrv-args carrying its own feature selection REPLACES the automatic
          # --all-features rather than joining it. A lib+CLI hybrid verifying its
          # floor with --no-default-features would otherwise get both flags and
          # cargo would reject the pair -- reading as a broken MSRV rather than a
          # broken invocation.
          extra=()
          if [ -n "${MSRV_ARGS:-}" ]; then read -r -a extra <<< "$MSRV_ARGS"; fi
          feats=()
          case " ${MSRV_ARGS:-} " in
            *" --no-default-features "*|*" --features "*|*" --all-features "*) ;;
            *) [ "$ALLF" = "true" ] && feats=(--all-features) || true ;;
          esac
          echo "verifying ${MEMBER:-<workspace>} at its declared floor $MSRV"
          set -x
          cargo "+$MSRV" "$CHECK" "${scope[@]}" "${feats[@]}" "${extra[@]}"

  deny:
    timeout-minutes: 20
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch shared deny.toml
        if: inputs.deny-config-repo != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.deny-config-repo }}
          ref: ${{ inputs.deny-config-ref }}
          path: .fleet-config
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-deny
      - name: Check advisories, bans, licenses, sources
        shell: bash
        env:
          DENY_ARGS: ${{ inputs.deny-args }}
        run: |
          set -euo pipefail
          # Argument order is load-bearing and cargo-deny will not forgive it:
          #   --config belongs to the `check` SUBCOMMAND, not to `cargo deny`.
          #   `cargo deny --config X check all` fails with
          #     "error: unexpected argument '--config' found
          #      tip: 'check --config' exists"
          # while `--all-features` / `--exclude` / `--target` are the opposite:
          # GLOBAL options that must precede `check`. Verified against
          # cargo-deny 0.19.0 by running both forms.
          read -r -a globals <<< "${DENY_ARGS}"
          if [ -n '${{ inputs.deny-config-repo }}' ]; then
            cfg=".fleet-config/${{ inputs.deny-config-path }}"
            if [ ! -f "$cfg" ]; then
              echo "::error::shared deny config not found at ${{ inputs.deny-config-repo }}@${{ inputs.deny-config-ref }}:${{ inputs.deny-config-path }} (resolved to $cfg). Refusing to silently fall back to a repo-local config -- that would report a pass against a config nobody chose."
              exit 1
            fi
            echo "Using shared config: $cfg"
            set -x
            cargo deny "${globals[@]}" check --config "$cfg" all
          else
            # Symmetric to the shared-config guard above: a missing config must
            # never become a silent pass. Without deny.toml cargo-deny falls back
            # to its built-in defaults, which are neither this repo's policy nor
            # the fleet's -- exactly the "pass against a config nobody chose" this
            # job refuses in the other direction.
            if [ ! -f deny.toml ]; then
              echo "::error::no deny.toml in this repository and no deny-config-repo set. Refusing to run against cargo-deny's built-in defaults -- that would report a pass against a config nobody chose. Add a deny.toml, or set deny-config-repo to opt into the shared one."
              exit 1
            fi
            echo "Using repo-local deny.toml"
            set -x
            cargo deny "${globals[@]}" check all
          fi

  vet:
    timeout-minutes: 20
    name: cargo-vet
    if: inputs.vet
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        if: inputs.system-packages != '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Bounded and retried, deliberately. `apt-get update` with no timeout
          # hung on an unreachable Azure mirror and sat there until GitHub killed
          # the job on its SIX HOUR limit -- six repos, one wasted runner each,
          # and a red `ci / All checks` that looked like a code failure. A mirror
          # being unreachable is infrastructure; it should fail in minutes and
          # say so, not consume the job's entire budget.
          attempt=1
          until sudo timeout 300 apt-get update; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::apt-get update failed or timed out on all 3 attempts. The runner's package mirror is unreachable; this is infrastructure, not a code failure."
              exit 1
            fi
            echo "::warning::apt-get update failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          sudo timeout 600 apt-get install -y ${{ inputs.system-packages }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-vet
      # `--locked` here is load-bearing: a bare `cargo fetch` RE-RESOLVES and
      # rewrites Cargo.lock in the runner, so the `--locked` on the next line
      # would validate a lock CI just generated for itself rather than the
      # committed bytes. 80 of 81 fleet repos had this shape; blazehash's lock
      # drifted from its manifest for seven weeks while this gate stayed green.
      - run: cargo fetch --locked
      - run: cargo vet --locked

  secret-scan:
    timeout-minutes: 20
    name: Secret Scan (gitleaks)
    if: inputs.secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs full history, not the default shallow clone
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          v='${{ inputs.gitleaks-version }}'
          # Pinned version, never a `latest` API call: the unauthenticated
          # GitHub API is rate-limited on shared runners, which yields an empty
          # version and a 404 download that some shells swallow.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan
        shell: bash
        run: |
          set -euo pipefail
          # 60 fleet repos ship a .gitleaks.toml allowlisting forensic fixtures
          # that look like credentials (key material in a test image is the
          # artifact under test, not a leak). Ignoring it would bury the job in
          # false positives, and a scanner nobody trusts is a scanner nobody reads.
          cfg=()
          if [ -f .gitleaks.toml ]; then
            cfg=(--config .gitleaks.toml)
            echo "Using repo-local .gitleaks.toml"
          fi
          # `git` mode walks commit patches; `dir` mode catches an unstaged or
          # gitignored file that never became a commit. Both, because either
          # alone leaves a real hole.
          /tmp/gitleaks git  --redact --no-banner --exit-code 1 "${cfg[@]}" .
          /tmp/gitleaks dir  --redact --no-banner --exit-code 1 "${cfg[@]}" .
      # KNOWN GAP, stated rather than papered over: gitleaks scans patch content
      # and files. It does NOT read commit messages or tag annotations, so a
      # credential pasted into a commit message is invisible to this job. That
      # is what `git log --all --grep=<marker> -F` is for, and why commit
      # messages go through `git commit -F <file>`.

  unsafe-audit:
    timeout-minutes: 20
    name: Unsafe lint audit
    if: inputs.unsafe-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Same reasoning as path-deps: `job_workflow_sha` pins the script to the
      # exact revision the caller pinned, never a floating branch.
      - name: Fetch the check
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SecurityRonin/fleet-ci
          ref: ${{ github.job_workflow_sha }}
          path: .fleet-ci
      - name: Every member effectively forbids unsafe_code
        shell: bash
        env:
          EXEMPT: ${{ inputs.unsafe-audit-exempt }}
        run: python3 .fleet-ci/scripts/check_unsafe_lints.py "$GITHUB_WORKSPACE" "$EXEMPT"

  package-check:
    timeout-minutes: 20
    name: Package completeness
    if: inputs.package-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: README and LICENSE reach every published crate
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;[print(p['name']) for p in json.load(sys.stdin)['packages'] if p.get('publish') != []]")
          if [ -z "$pkgs" ]; then
            echo "No publishable crate in this workspace - nothing to check."
            exit 0
          fi
          fail=0
          for p in $pkgs; do
            list=$(cargo package -p "$p" --list --allow-dirty)
            if ! printf '%s\n' "$list" | grep -qx 'README.md'; then
              echo "::error::$p does not package README.md - it reaches crates.io with a blank page"
              fail=1
            fi
            if ! printf '%s\n' "$list" | grep -q '^LICENSE'; then
              echo "::error::$p does not package a LICENSE file"
              fail=1
            fi
            [ "$fail" -eq 0 ] && echo "ok  $p packages README.md and LICENSE"
          done
          exit "$fail"

  fuzz-build:
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    name: Fuzz (build check)
    if: inputs.fuzz-build-check
    runs-on: ubuntu-latest
    # -Dwarnings must not leak into cargo-fuzz's own build or the nightly fuzz
    # build; nightly warns more freely and lint enforcement is clippy's job.
    env:
      RUSTFLAGS: ""
    steps:
      - name: Free disk space
        if: inputs.free-disk-space && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Install system packages (macOS)
        if: inputs.system-packages-macos != '' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `brew install` is already retried internally and bounded by the job
          # ceiling; `--quiet` keeps the log readable.
          brew install --quiet ${{ inputs.system-packages-macos }}
      - name: Install system packages
        if: inputs.system-packages != '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Bounded and retried, deliberately. `apt-get update` with no timeout
          # hung on an unreachable Azure mirror and sat there until GitHub killed
          # the job on its SIX HOUR limit -- six repos, one wasted runner each,
          # and a red `ci / All checks` that looked like a code failure. A mirror
          # being unreachable is infrastructure; it should fail in minutes and
          # say so, not consume the job's entire budget.
          attempt=1
          until sudo timeout 300 apt-get update; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::apt-get update failed or timed out on all 3 attempts. The runner's package mirror is unreachable; this is infrastructure, not a code failure."
              exit 1
            fi
            echo "::warning::apt-get update failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          sudo timeout 600 apt-get install -y ${{ inputs.system-packages }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect fuzz crates
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # A fuzz crate is NOT always at the repo root: fleet-wide it sits at
          # `fuzz/` (70 repos) but also `core/fuzz`, `forensic/fuzz`, and
          # `crates/<member>/fuzz` (11 repos). Checking only `-d fuzz` would skip
          # those silently — a fuzz job that passes by finding nothing is worse
          # than no fuzz job, because it reads as coverage that does not exist.
          # cargo-fuzz runs from the crate that OWNS the fuzz dir, i.e. its parent.
          find . -type d -name fuzz -not -path '*/target/*' -not -path '*/.*/*' \
            -exec test -f '{}/Cargo.toml' \; -print \
            | sed 's![/]fuzz$!!' | sed 's!^$!.!' | sort -u > /tmp/fuzz_dirs.txt
          n=$(wc -l < /tmp/fuzz_dirs.txt | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No fuzz crate in this repo — skipping."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found $n fuzz crate(s):"; cat /tmp/fuzz_dirs.txt
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: steps.detect.outputs.present == 'true'
        with:
          toolchain: nightly
          components: rust-src
      - name: Apply cargo config and build env
        if: inputs.cargo-config != '' || inputs.build-env != ''
        shell: bash
        env:
          CARGO_CONFIG: ${{ inputs.cargo-config }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          # Through env, never inlined: both values are free-form text and GitHub
          # substitutes expressions into the SCRIPT TEXT, where a quote or a
          # bracket would reach bash as syntax.
          if [ -n "${CARGO_CONFIG:-}" ]; then
            mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
            printf '%s\n' "$CARGO_CONFIG" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
            echo "appended to ${CARGO_HOME:-$HOME/.cargo}/config.toml:"
            printf '%s\n' "$CARGO_CONFIG"
          fi
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) printf '%s\n' "$line" >> "$GITHUB_ENV"; echo "exported: $line" ;;
                *)   echo "::error::build-env line is not KEY=VALUE: $line"; exit 1 ;;
              esac
            done <<< "$BUILD_ENV"
          fi
      - name: Install cargo-fuzz
        if: steps.detect.outputs.present == 'true'
        # Deliberately not --locked: cargo-fuzz's pinned Cargo.lock holds an old
        # rustix whose rustc_* attributes current nightly rejects.
        run: cargo install cargo-fuzz
      - name: Build fuzz targets
        if: steps.detect.outputs.present == 'true'
        shell: bash
        # `+nightly` on the command line beats rust-toolchain.toml's stable pin;
        # without it the pin wins and `-Z sanitizer=address` is rejected.
        run: |
          set -euo pipefail
          while read -r dir; do
            echo "::group::cargo fuzz build in ${dir}"
            (cd "$dir" && cargo +nightly fuzz build)
            echo "::endgroup::"
          done < /tmp/fuzz_dirs.txt

