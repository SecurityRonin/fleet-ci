          tool: cargo-llvm-cov

      - name: Assemble coverage flags
        id: flags
        shell: bash
        env:
          # Through env, never inlined: `package:<name>` is user-supplied text and
          # GitHub substitutes expressions into the SCRIPT TEXT, so a crafted value
          # would reach bash as syntax. Same reasoning as COV_IGNORE below.
          COV_SCOPE: ${{ inputs.coverage-scope }}
        run: |
          set -euo pipefail
          case "$COV_SCOPE" in
            workspace)  f="--workspace" ;;
            lib)        f="--workspace --lib" ;;
            package:*)  pkg="${COV_SCOPE#package:}"
                        if [ -z "$pkg" ]; then
                          echo "::error::coverage-scope 'package:' has no package name after the colon."
                          exit 1
                        fi
                        f="-p $pkg" ;;
            *)          echo "::error::coverage-scope must be 'workspace', 'lib' or 'package:<name>' — got '$COV_SCOPE'."
                        exit 1 ;;
          esac
          [ '${{ inputs.all-features }}' = 'true' ] && f="$f --all-features" || true
          # The regex is deliberately NOT folded into this flag string. GitHub
          # substitutes workflow expressions into the SCRIPT TEXT, so a value with regex
          # metacharacters — the fleet's own `(^|/)src/(main\.rs|bin/)` — reaches
          # bash as syntax and the job dies with
          #   syntax error near unexpected token `('
          # before cargo ever runs. That reads like a coverage failure and is not
          # one. Each llvm-cov step takes the value through `env:` instead, where
          # normal shell quoting applies.
          echo "flags=$f" >> "$GITHUB_OUTPUT"
          echo "cargo llvm-cov $f"

      # -- MIGRATION PATH ------------------------------------------------------
      - name: Aggregate line floor
        if: inputs.coverage-gate == 'floor'
        shell: bash
        env:
          COV_IGNORE: ${{ inputs.coverage-ignore-regex }}
          COV_METRIC: ${{ inputs.coverage-metric }}
          COV_FLOOR: ${{ inputs.coverage-floor }}
        run: |
          set -euo pipefail
          echo "::warning::This repo is on the aggregate coverage FLOOR (${{ inputs.coverage-floor }}%), not the fleet per-line gate. An aggregate percentage cannot honour a '// cov:unreachable' exemption, so it neither identifies which lines are uncovered nor lets a provably-dead guard be annotated instead of deleted. Migrate to coverage-gate: strict."
          ig=()
          [ -n "${COV_IGNORE:-}" ] && ig=(--ignore-filename-regex "$COV_IGNORE") || true
          under=()
          case "$COV_METRIC" in
            lines)     under=(--fail-under-lines "$COV_FLOOR") ;;
            functions) under=(--fail-under-functions "$COV_FLOOR") ;;
            both)      under=(--fail-under-lines "$COV_FLOOR" --fail-under-functions "$COV_FLOOR") ;;
            *)         echo "::error::coverage-metric must be lines, functions or both — got '$COV_METRIC'."
                       exit 1 ;;
          esac
          cargo llvm-cov ${{ steps.flags.outputs.flags }} "${ig[@]}" --summary-only "${under[@]}"
      - name: Show missing lines (advisory)
        if: inputs.coverage-gate == 'floor'
        continue-on-error: true
        env:
          COV_IGNORE: ${{ inputs.coverage-ignore-regex }}
        run: |
          ig=()
          [ -n "${COV_IGNORE:-}" ] && ig=(--ignore-filename-regex "$COV_IGNORE")
          cargo llvm-cov ${{ steps.flags.outputs.flags }} "${ig[@]}" --summary-only --show-missing-lines

      # -- THE FLEET GATE ------------------------------------------------------
      - name: Generate lcov
        if: inputs.coverage-gate == 'strict'
        env:
          COV_IGNORE: ${{ inputs.coverage-ignore-regex }}
        run: |
          ig=()
          [ -n "${COV_IGNORE:-}" ] && ig=(--ignore-filename-regex "$COV_IGNORE")
          cargo llvm-cov ${{ steps.flags.outputs.flags }} "${ig[@]}" --lcov --output-path lcov.info

      - name: Enforce per-line coverage
        if: inputs.coverage-gate == 'strict'
        shell: bash
        env:
          REQUIRE_REASON: ${{ inputs.require-exemption-reason }}
          COV_METRIC: ${{ inputs.coverage-metric }}
          COV_INCLUDE: ${{ inputs.coverage-include-regex }}
        run: |
          python3 - lcov.info <<'PYGATE'
          import os, re, sys

          # Fail the build unless every executable line is covered. Two exemptions,
          # both narrow, both reported by file:line so the gate stays auditable:
          #
          #  1. `// cov:unreachable: <invariant>` — a guard that is provably dead
          #     under a stated dominating invariant. Defence in depth beats coverage
          #     purism: the guard is desirable and must not be deleted to satisfy a
          #     number. The invariant is required, because an unreviewable assertion
          #     is not evidence.
          #
          #  2. Delimiter-only lines (`}`, `)`, `);`, `)?;`, `,`) — llvm-cov emits a
          #     zero-count record on some of these as a region-attribution artifact.
          #     A line carrying nothing but a delimiter has no behaviour of its own,
          #     so this hides no untested logic.
          #
          # Anything else with a zero hit count is an uncovered line and fails.
          #
          # `coverage-metric` selects WHAT must be covered. Lines alone are blind to a
          # function that is never entered while its lines are covered by another
          # monomorphized instance of the same generic — llvm-cov emits one FN record
          # per instantiation but one DA record per source line. A reader-generic crate
          # can therefore sit at 100% lines with instantiations nobody ever called.
          #
          # `coverage-include-regex` selects WHERE the gate applies. It is the positive
          # complement of `coverage-ignore-regex`, and it exists because that one cannot
          # express it: `--ignore-filename-regex` is evaluated by the Rust regex crate,
          # which has no lookahead, so "gate only this path" is not writable as an
          # exclusion. Files outside it are still MEASURED — the reported numbers stay
          # honest — they are simply not gated.

          lcov_path = sys.argv[1]
          require_reason = os.environ.get("REQUIRE_REASON") == "true"
          metric = (os.environ.get("COV_METRIC") or "lines").strip()
          include_raw = (os.environ.get("COV_INCLUDE") or "").strip()

          if metric not in ("lines", "functions", "both"):
              print(f"::error::coverage-metric must be lines, functions or both — got {metric!r}")
              sys.exit(1)

          try:
              include_re = re.compile(include_raw) if include_raw else None
          except re.error as exc:
              print(f"::error::coverage-include-regex is not a valid regex ({exc}): {include_raw!r}")
              sys.exit(1)

          gate_lines = metric in ("lines", "both")
          gate_functions = metric in ("functions", "both")

          DELIM_ONLY = re.compile(r"^[}\)\];,?]*$")
          # Matched as a bare substring, not anchored to `//`. The fleet writes the
          # marker in a line comment, a trailing block comment (`/* ... */`), and a
          # doc comment; anchoring to one syntax silently drops the others back into
          # the failure set.
          MARKER = re.compile(r"cov:unreachable(?P<reason>\s*:\s*\S.*)?")

          src_cache = {}

          def source_line(path, n):
              if path not in src_cache:
                  try:
                      with open(path, encoding="utf-8", errors="replace") as fh:
                          src_cache[path] = fh.read().splitlines()
                  except OSError as exc:
                      src_cache[path] = exc
              lines = src_cache[path]
              if isinstance(lines, OSError):
                  return None
              return lines[n - 1] if 0 < n <= len(lines) else None

          uncovered, exempt_annotated, exempt_delim, bare_markers, unreadable = [], [], [], [], []
          uncovered_fns, exempt_fns = [], []
          gated_files, skipped_files = set(), set()
          current = None
          gated = False
          fn_line = {}

          with open(lcov_path, encoding="utf-8", errors="replace") as fh:
              for raw in fh:
                  raw = raw.rstrip("\n")
                  if raw.startswith("SF:"):
                      current = raw[3:]
                      gated = include_re.search(current) is not None if include_re else True
                      (gated_files if gated else skipped_files).add(current)
                      fn_line = {}
                      continue
                  if current is None or not gated:
                      continue

                  m = re.match(r"^FN:(\d+),(.+)$", raw)
                  if m:
                      fn_line[m.group(2)] = int(m.group(1))
                      continue

                  m = re.match(r"^FNDA:0,(.+)$", raw)
                  if m and gate_functions:
                      name = m.group(1)
                      n = fn_line.get(name)
                      if n is None:
                          # A hit record with no matching FN declaration: we cannot point at
                          # a source line, so we cannot let it pass unexamined either.
                          uncovered_fns.append((current, 0, name))
                          continue
                      src = source_line(current, n)
                      if src is not None and MARKER.search(src):
                          exempt_fns.append((current, n, name))
                      else:
                          uncovered_fns.append((current, n, name))
                      continue

                  m = re.match(r"^DA:(\d+),0$", raw)
                  if not m or not gate_lines:
                      continue
                  n = int(m.group(1))
                  src = source_line(current, n)
                  if src is None:
                      # Fail loud: a zero-hit line we cannot read is not a pass.
                      unreadable.append((current, n))
                      continue
                  marker = MARKER.search(src)
                  if marker:
                      if marker.group("reason"):
                          exempt_annotated.append((current, n, src.strip()))
                      elif require_reason:
                          bare_markers.append((current, n, src.strip()))
                      else:
                          exempt_annotated.append((current, n, src.strip()))
                  elif DELIM_ONLY.match(src.strip()):
                      exempt_delim.append((current, n, src.strip()))
                  else:
                      uncovered.append((current, n, src.strip()))

          # A scope that matches nothing is a gate running over zero files. That reports
          # green while verifying nothing, so it is an error rather than a pass.
          if include_re is not None and not gated_files:
              print(f"::error::coverage-include-regex {include_raw!r} matched none of the "
                    f"{len(skipped_files)} file(s) in the coverage report — this gate would "
                    f"run over nothing. Fix the pattern, or remove it to gate everything.")
              sys.exit(1)

          for path, n, src in uncovered:
              print(f"::error file={path},line={n}::uncovered line: {src}")
          for path, n, name in uncovered_fns:
              where = f"file={path},line={n}" if n else f"file={path}"
              print(f"::error {where}::function never entered: {name}. Every monomorphized "
                    f"instance must be exercised, or annotated '// cov:unreachable: <why>'.")
          for path, n, src in bare_markers:
              print(f"::error file={path},line={n}::bare '// cov:unreachable' with no invariant. "
                    f"Write '// cov:unreachable: <why this is provably dead>' — the marker asserts "
                    f"a guard cannot be reached, and an assertion with no stated reason cannot be reviewed.")
          for path, n in unreadable:
              print(f"::error::lcov reports {path}:{n} uncovered but the source file could not be read; "
                    f"refusing to treat an unverifiable line as covered.")

          print(f"\nmetric: {metric}   gated files: {len(gated_files)}"
                + (f"   not gated (still measured): {len(skipped_files)}" if include_re else ""))
          print(f"uncovered lines: {len(uncovered)}  "
                f"uncovered functions: {len(uncovered_fns)}  "
                f"bare markers: {len(bare_markers)}  "
                f"unreadable: {len(unreadable)}")
          print(f"exempt (// cov:unreachable): {len(exempt_annotated) + len(exempt_fns)}  "
                f"exempt (delimiter artifact): {len(exempt_delim)}")

          if exempt_annotated or exempt_fns:
              print("\nAnnotated exemptions (each asserts a dominating invariant):")
              for path, n, src in exempt_annotated:
                  print(f"  {path}:{n}: {src}")
              for path, n, name in exempt_fns:
                  print(f"  {path}:{n}: (function) {name}")

          if uncovered or uncovered_fns or bare_markers or unreadable:
              sys.exit(1)
          print("\nEvery gated line and function is covered, or carries a justified // cov:unreachable.")
          PYGATE

  # ---------------------------------------------------------------------------
  # ONE STABLE CONTEXT FOR BRANCH PROTECTION
  #
  # Matrix jobs embed their matrix values in the published check name --
  # `MSRV (sqlite-core, 1.80)`, `Test (ubuntu-latest)`. Requiring those directly
  # in branch protection is a trap: the name changes when a crate is added or an
  # MSRV floor is raised, the required context then never reports, and every PR
  # in the repo becomes unmergeable with no visible cause.
  #
  # This job's name never varies, so it can be required once and stay valid.
  # Require exactly `ci / All checks`.
  gate:
    timeout-minutes: 10
    name: All checks
    needs:
      - path-deps
      - fmt
      - clippy
      - test
      - msrv-matrix
      - msrv
      - deny
      - vet
      - secret-scan
      - unsafe-audit
      - package-check
      - fuzz-build
      - docs
      - coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded (or was deliberately skipped)
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          python3 - "$RESULTS" <<'PYGATE'
          import json, sys
          results = json.loads(sys.argv[1])
          if not results:
              print("::error::no job results reported -- this gate ran over nothing")
              sys.exit(1)
          bad = sorted(k for k, v in results.items()
                       if v.get("result") not in ("success", "skipped"))
          if bad:
              print(f"::error::did not succeed: {', '.join(bad)}")
              sys.exit(1)
          # An empty check list means NOT RUN, never PASSED: a workflow where every
          # job skipped would otherwise report green over zero work.
          if not any(v.get("result") == "success" for v in results.values()):
              print("::error::every job skipped -- nothing was actually verified")
              sys.exit(1)
          ok = sorted(k for k, v in results.items() if v.get("result") == "success")
          skipped = sorted(k for k, v in results.items() if v.get("result") == "skipped")
          print(f"succeeded: {', '.join(ok)}")
          if skipped:
              print(f"skipped:   {', '.join(skipped)}")
          PYGATE
