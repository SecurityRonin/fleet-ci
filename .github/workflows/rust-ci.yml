            echo "appended to ${CARGO_HOME:-$HOME/.cargo}/config.toml:"
            printf '%s\n' "$CARGO_CONFIG"
          fi
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) printf '%s\n' "$line" >> "$GITHUB_ENV"; echo "exported: $line" ;;
